<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-labelledby="t d">
<title id="t">Activity Graph</title>
<desc id="d">Weekly activity velocity graph over 52 weeks with peak of 35 contributions per week.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Fira Code',monospace;font-size:15px}
.dim{fill:#8b949e}.cy{fill:#00d9ff}.fg{fill:#c9d1d9}.gr{fill:#3fb950}.wh{fill:#f0fbff}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

.pt{transition:all .2s ease; cursor:pointer}
.pt:hover{r:6.5; fill:#ffffff; filter:drop-shadow(0 0 8px #00d9ff) drop-shadow(0 0 16px #00d9ff)}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00d9ff" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>

<linearGradient id="activity_grad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#00d9ff" stop-opacity=".45"/>
  <stop offset="60%" stop-color="#ff2bd6" stop-opacity=".15"/>
  <stop offset="100%" stop-color="#03040a" stop-opacity="0"/>
</linearGradient>
<filter id="line_glow" x="-20%" y="-40%" width="140%" height="180%">
  <feGaussianBlur stdDeviation="3.5" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>
<path d="M16 16V304M864 16V304M16 16H864M16 304H864" fill="none" stroke="#00d9ff" stroke-width="3" opacity=".55" filter="url(#glow)"/>
