<line x1="52" y1="54" x2="172" y2="54" stroke="#00d9ff" stroke-width="3" filter="url(#g)"/>
<g class="ln" style="animation-delay:.15s">
  <text x="52" y="82" class="dim" style="font-size:13px">
    <tspan class="gr">$</tspan> render-activity --timeline 52w --metric velocity <tspan fill="#484f58"># interactive commit trend</tspan>
  </text>
  <text x="828" y="82" text-anchor="end" class="cy" style="font-size:12px;font-weight:700">
    Peak: 35 commits/wk &#160;&#160;<tspan class="dim">|</tspan>&#160;&#160; Total: 89 commits
  </text>
</g>
