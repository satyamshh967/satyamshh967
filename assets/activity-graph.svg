<text x="52" y="40" font-weight="700" style="font-size:20px"><tspan class="cy">~/</tspan><tspan class="wh">activity-graph</tspan></text>
<text x="828" y="40" text-anchor="end" letter-spacing="2" fill="#6e7681" style="font-size:12px">// 04</text>
<line x1="52" y1="54" x2="828" y2="54" stroke="#00d9ff" stroke-opacity=".4"/>
